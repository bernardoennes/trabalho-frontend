<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bonheur+Royale&display=swap"
      rel="stylesheet"
    />
    <title>Contato</title>
    <link
      rel="shortcut icon"
      href="./assets/logo.pnj.jpg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <div class="header-banner">
        <div class="madeira-banner">
          <img id="logo" src="../images/logo com fundo.png" alt="Logotipo" />
        </div>
      </div>
      <nav>
        <button class="nav-button">Cardápio</button>
        <button class="nav-button" onclick="window.location.href='../Home/index.html'">Menu</button>
      </nav>
    </header>
    <main>
      <main>
        <section id="contact-info">
          <h2>Informações de Contato</h2>
          <p><strong>Endereço:</strong> Rua das Pizzas, 123 - Centro</p>
          <p><strong>Telefone:</strong> (21) 1234-5678</p>
          <p><strong>Email:</strong> contato@pizzaria.com</p>
        </section>

        <section id="contact-form">
          <h2>Envie uma Mensagem</h2>
          <form action="submit_form.php" method="POST">
            <label for="name">Nome:</label>
            <input type="text" id="name" name="name" required />

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required />

            <label for="message">Mensagem:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Enviar Mensagem</button>
          </form>
        </section>

        <section id="map-container">
          <h2>Localização</h2>
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3656.053383464379!2d-46.65657338543616!3d-23.597873868413123!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce59bfa4ec2a2b%3A0xf0e7a6e8f5ef8a7a!2sAv.%20Paulista%2C%201576%20-%20Bela%20Vista%2C%20S%C3%A3o%20Paulo%20-%20SP%2C%2001310-200!5e0!3m2!1spt-BR!2sbr!4v1683570450200!5m2!1spt-BR!2sbr"
            width="100%"
            height="250"
            style="border: 0; border-radius: 8px"
            allowfullscreen=""
            loading="lazy"
          >
          </iframe>
        </section>
      </main>
    </main>
  </body>
</html>
