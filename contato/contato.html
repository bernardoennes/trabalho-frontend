<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="shortcut icon" href="./assets/logo.pnj.jpg" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="header-banner">
          <div class="madeira-banner">
            <img id="logo" src="../images/logo.png" alt="Logotipo" />
          </div>
        </div>
        <nav>
          <button class="nav-button">Cardápio</button>
          <button class="nav-button">Contato</button>
        </nav>
      </header>
    <main>

        <section id="contact-info">
            <h1>Fale Conosco:</h1>
            <h2>Informações de Contato</h2>
            <p><strong>Endereço:</strong> Rua das Pizzas, 123 - Centro</p>
            <p><strong>Telefone:</strong> (21) 1234-5678</p>
            <p><strong>Email:</strong> contato@pizzaria.com</p>
        </section>

        <section id="contact-form">
            <h2>Envie uma Mensagem</h2>
            <form action="submit_form.php" method="POST">
                <label for="name">Nome:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Mensagem:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Enviar Mensagem</button>

                <section id="contact-info">
                    <h2>Informações de Contato</h2>
                    <p><strong>Endereço:</strong> Rua das Pizzas, 123 - Centro</p>
                    <p><strong>Telefone:</strong> (21) 1234-5678</p>
                    <p><strong>Email:</strong> contato@pizzaria.com</p>
                   
                    <div id="map-container">
                        <h2>Localização</h2>
                        <iframe id="map"
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.8354345093745!2d144.95373631567253!3d-37.816279442021734!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad642af0f11fd81%3A0xf0727bafcf84d474!2sFederation%20Square!5e0!3m2!1sen!2sau!4v1573635311914!5m2!1sen!2sau"
                            allowfullscreen="" loading="lazy">
                        </iframe>
                    </div>
                </section>
            </form>
        </section>
    </main>
</body>

</html>
