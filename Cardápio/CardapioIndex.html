<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="Apresentação do cardápio">
  <title>Cardápio</title>
  <link rel="shortcut icon" href="./assets/Serrana Pizzaria logo (fundo branco).png" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
  <Header>
    <img id="FundoDeMadeira" src="./assets/1900938-textura-de-madeira-escura-rustica.jpg" alt="TexturaDeMadeiraParaHeader" width="1500" height="200">
    <img id="LogoComFundo" src="./assets/Serrana Pizzaria logo (fundo branco).png" alt="Logotipo_png" width="150" height="150">
    </Header>
     <header>
        <!-- Aqui estamos criando um container para apresentação do cardápio. -->
    <div id="container">
    <h1>Conheça nosso cardápio e se surpreenda com cada detalhe!</h1>
   </header>
   </div>
  </main>
</body>
         <!-- Aqui estamos criando um anúncio com os valores. -->
<link rel="stylesheet"  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" defer></script>
    <style>
        body {
            background-color: #333;
            color: white;
        }
        .card {
            background-color: #444;
            border: none;
            color: white;
        }
        .price {
            font-size: 2rem;
            color: #ffc107;
        }
        .separator {
            border-bottom: 2px dashed #ffc107;
            margin-bottom: 10px;
        }
        .extra-card {
            background-color: white;
            color: #333;
            text-align: center;
        }
        .extra-card h3 {
            color: #b71c1c;
        }
        .extra-price {
            color: #b71c1c;
            font-size: 1.2rem;
        }

        .cardPizzas {
            background-color: #444;
            border: none;
            color: white;
        }
    </style>
    <title>Cardápio Pizzaria</title>
</head>
<body>
<div class="container py-5">
    <div class="row text-center">
        <div class="col-md-3">
            <div class="card p-3">
                <h5>PIZZA<br>MÉDIA</h5>
                <p>(25 CM)</p>
                <div class="separator"></div>
                <p class="price">R$ 37,90</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3">
                <h5>PIZZA<br>GIGANTE</h5>
                <p>(35 CM)</p>
                <div class="separator"></div>
                <p class="price">R$ 57,90</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3">
                <h5>PIZZA<br>SUPER GIGA</h5>
                <p>(40 CM)</p>
                <div class="separator"></div>
                <p class="price">R$ 67,90</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card extra-card p-3">
                <h3>ADICIONE<br>BORDA</h3>
                <div class="separator"></div>
                <p>MÉDIA <span class="extra-price">R$ 6,90</span></p>
                <p>GIGA <span class="extra-price">R$ 8,90</span></p>
                <p>SUPER <span class="extra-price">R$ 9,90</span></p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
      <div class="card p-3">
        <img src="./assets/Margherita-Pizza.webp" alt="Imagem Margherita" width="150" height="100"/>
          <h6>PIZZA <strong><abbr title="Mussarela, tomate e manjericão"
            > MARGHERITA</abbr></strong></h6>
          <div class="separator"></div>
      </div>
  </div>
</div>
</body>
</html>
